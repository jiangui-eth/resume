name: PR Check Pipeline

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      # ── Setup ────────────────────────────────────────────────────────────────

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # ── Step 2: ESLint ───────────────────────────────────────────────────────

      - name: ESLint
        run: pnpm exec next lint

      # ── Step 3: Prettier ─────────────────────────────────────────────────────

      - name: Prettier format check
        run: pnpm exec prettier --check "apps/web/src/**/*.{ts,tsx}" "apps/web/*.{ts,json}"
        working-directory: .

      # ── Step 4: TypeScript ───────────────────────────────────────────────────

      - name: TypeScript type check
        run: pnpm tsc --noEmit

      # ── Step 5: Unit tests ───────────────────────────────────────────────────

      - name: Unit & integration tests
        run: pnpm test --run

      # ── Step 6: Production build ─────────────────────────────────────────────

      - name: Production build
        run: pnpm build

      # ── Step 7: Lighthouse CI ────────────────────────────────────────────────

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Lighthouse CI
        run: lhci autorun

      # ── Step 8: Playwright visual regression ─────────────────────────────────

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright visual regression
        run: pnpm exec playwright test
        env:
          CI: true
          BASE_URL: http://localhost:3000

      # ── Step 9: Link validity check ──────────────────────────────────────────

      - name: Link validity check
        run: node scripts/check-links.mjs
        env:
          SITE_URL: https://jiangui-resume.vercel.app

      # ── Artifacts on failure ─────────────────────────────────────────────────

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-failure-report
          path: |
            apps/web/playwright-report/
            apps/web/.lighthouseci/
          retention-days: 7
