overrides:
  # semver@6.3.1 lost provenance attestation; pin to 6.3.0 which has it
  "semver@^6.3.1": "6.3.0"

trustPolicy: no-downgrade
shellEmulator: true

packages:
  - apps/*
  - packages/*
allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  msw: true
  sharp: true
  workerd: true
catalog:
  # Core
  dotenv: ^17.2.2
  zod: ^4.1.13
  typescript: ^6

  # React
  react: ^19.2.6
  react-dom: ^19.2.6
  "@types/react": ^19.2.15
  "@types/react-dom": ^19.2.3
  "@types/node": ~20.11.0

  # Next.js
  next: ^16.2.0
  next-intl: ^4.13.0
  next-themes: ^0.4.6
  babel-plugin-react-compiler: ^1.0.0

  # Cloudflare
  "@opennextjs/cloudflare": ^1.19.11
  "@cloudflare/workers-types": ^4.20251213.0
  wrangler: ^4.77.0
  alchemy: ^0.91.2

  # tRPC
  "@trpc/server": ^11.16.0
  "@trpc/client": ^11.16.0
  "@trpc/tanstack-react-query": ^11.16.0

  # TanStack
  "@tanstack/react-query": ^5.90.12
  "@tanstack/react-query-devtools": ^5.91.1

  # UI
  lucide-react: ^0.546.0
  sonner: ^2.0.5
  tailwindcss: ^4.1.18
  "@tailwindcss/postcss": ^4.1.18
  "@tailwindcss/vite": ^4.1.18
  tailwind-merge: ^3.3.1
  tw-animate-css: ^1.3.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  "@base-ui/react": ^1.0.0
  shadcn: 3.6.2
  sharp: ^0.34.5

  # State management
  jotai: ^2.12.5
  zustand: ^5.0.6

  # Monitoring
  "@sentry/nextjs": ^10.0.0

  # Auth (future use)
  better-auth: ^1.2.12

  # Env validation
  "@t3-oss/env-core": ^0.13.1
  "@t3-oss/env-nextjs": ^0.13.1

  # Build
  turbo: ^2.9.16
  vite: ^7.0.0

  # Linting
  "@antfu/eslint-config": ^9.0.0
  "@eslint-react/eslint-plugin": ^5.8.16
  eslint: ^10.4.1
  eslint-plugin-react-refresh: ^0.5.2

  # Formatting
  prettier: ^3.8.3
  prettier-plugin-tailwindcss: ^0.8.0

  # Commit conventions
  "@commitlint/cli": ^19.0.0
  "@commitlint/config-conventional": ^19.0.0
  husky: ^9.1.7
  lint-staged: ^17.0.7

  # Testing
  "@playwright/test": ^1.58.0
  storybook: ^10.0.0
  "@storybook/react": ^10.0.0
  "@storybook/addon-a11y": ^10.0.0
  "@storybook/addon-docs": ^10.0.0
  "@storybook/addon-themes": ^10.0.0
  "@storybook/react-vite": ^10.0.0
